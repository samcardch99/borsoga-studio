name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run build
        env:
          PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.PUBLIC_EMAILJS_SERVICE_ID }}
          PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.PUBLIC_EMAILJS_TEMPLATE_ID }}
          PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.PUBLIC_EMAILJS_PUBLIC_KEY }}
          # Twenty CRM native Workflow webhook (inbound trigger) that creates the
          # lead. Public endpoint (also visible in the client bundle) → safe to inline.
          PUBLIC_LEAD_WEBHOOK_URL: https://crm.borsogastudio.com/webhooks/workflows/c434a3ba-e3ba-4cf2-97db-25f2d849944a/2ac7762d-4064-4bc5-a8d6-795ee7413e60

      - name: Publish dist to branch build
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: build
          force_orphan: true
          commit_message: "build: ${{ github.sha }}"
