name: Alcance

# Required check on `main`. The designer and the architect publish their own
# changes to the /plans funnel with no human review, and this check is what
# keeps those changes inside the funnel. They come two ways:
#
#   · ChatGPT/Codex, as the studio account `borsogastudio-ui`;
#   · Claude Code — Sam's own, so the PR is authored by samcardch99.
#
# So the author alone cannot tell them apart. AGENTS.md makes the AI put every
# requested change on a `cambio/…` branch, and that branch prefix is fenced
# whoever opens it — as is `claude/…`, the branch Claude Code on the web
# (claude.ai/code) may create on its own. Only Sam's PRs from other branches
# are unrestricted.
#
# `pull_request_target` runs this file as it is on `main`, not as the PR has
# it, so a PR cannot switch the check off by editing it. It never checks out
# the PR's code — it only reads the list of changed files — so running with
# the base branch's token is safe.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  alcance:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Solo archivos del funnel
        run: |
          if [ "$AUTHOR" = "samcardch99" ] && [[ "$BRANCH" != cambio/* ]] && [[ "$BRANCH" != claude/* ]]; then
            echo "PR de Sam fuera de una rama cambio/: sin límite de alcance."
            exit 0
          fi

          # The funnel: pages, forms, texts, styles and images. config.ts holds
          # the API origin and the routes, so it stays Sam's.
          PERMITIDO='^(src/plans/|src/components/plans/|public/plans/|src/styles/plans[^/]*\.css$)'
          PROHIBIDO='^src/plans/config\.ts$'

          todos=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' | sort -u)
          fuera=$( { echo "$todos" | grep -Ev "$PERMITIDO"; echo "$todos" | grep -E "$PROHIBIDO"; } | sort -u | sed '/^$/d')

          if [ -n "$fuera" ]; then
            echo "Archivos fuera del funnel:"; echo "$fuera"
            lista=$(echo "$fuera" | sed 's/^/- `/; s/$/`/')
            gh pr comment "$PR" --body "🚫 **Este cambio no se puede publicar solo**: toca archivos fuera de los formularios y páginas de planes, y eso tiene que hacerlo Sam.

          $lista"
            exit 1
          fi
          echo "Todo dentro del funnel."
